# Deploy automático: a cada push na main, envia public_html/ por FTP para a Hostinger.
# Segredos necessários no GitHub (Settings → Secrets and variables → Actions):
#   FTP_HOST  ex.: ftp.bravvobarbearia.com.br (ou o IP que o hPanel mostra)
#   FTP_USER  usuário da conta FTP criada no hPanel
#   FTP_PASS  senha dessa conta
# A conta FTP deve apontar para a pasta public_html/agendar (ou ajuste server-dir abaixo).
name: Deploy Hostinger

on:
  push:
    branches: [main]
    paths: ["public_html/**"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enviar por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftps
          local-dir: public_html/
          server-dir: ./
          exclude: |
            config.php
            config.example.php
            data/**
            .DS_Store
