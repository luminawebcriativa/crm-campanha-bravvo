<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bravvo Barbearia · Recebemos seu pedido</title>
<meta name="robots" content="noindex">
<link rel="icon" href="img/logo-bravvo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Bebas+Neue&display=swap">
<style>
  :root { --ink: #141412; --coal: #1b1b1b; --line: #2e2e29; --brass: #c3a05f; --cream: #e3dfd4; --muted: #a8a69b; --wa: #25d366; }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body { margin: 0; background: var(--ink); color: var(--cream); font-family: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif; line-height: 1.5;
    padding-inline: 20px; padding-block: 28px 48px;
    background-image: repeating-linear-gradient(135deg, transparent 0 14px, rgba(195,160,95,.035) 14px 16px); }
  .wrap { max-width: 440px; margin: 0 auto; }
  .brand { margin-bottom: 28px; }
  .brand img { height: 34px; width: auto; display: block; }
  .check { width: 56px; height: 56px; border: 2px solid var(--brass); border-radius: 50%; display: grid; place-items: center; margin-bottom: 18px; }
  h1 { font-family: "Bebas Neue", Impact, sans-serif; font-weight: 400; font-size: clamp(42px, 11vw, 56px); line-height: .94; margin: 0 0 12px; text-wrap: balance; }
  h1 em { font-style: normal; color: var(--brass); }
  p { color: var(--muted); margin: 0 0 12px; max-width: 36ch; }
  .steps { list-style: none; padding: 0; margin: 22px 0; display: grid; gap: 10px; }
  .steps li { display: flex; gap: 12px; align-items: flex-start; background: var(--coal); border: 1px solid var(--line); padding: 12px 14px; font-size: 14px; }
  .steps b { font-family: "Bebas Neue", Impact, sans-serif; font-weight: 400; font-size: 22px; color: var(--brass); line-height: 1; min-width: 20px; }
  .cta { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 14px; border-radius: 3px; text-decoration: none;
    background: var(--wa); color: #0b2b16; font-family: "Bebas Neue", Impact, sans-serif; font-size: 22px; letter-spacing: 2px; }
  .cta:focus-visible { outline: 2px solid var(--cream); outline-offset: 2px; }
  .fine { font-size: 12px; margin-top: 14px; }
</style>
<script>
  window.BRAVVO_PIXEL = "{{META_PIXEL_ID}}";
  if (window.BRAVVO_PIXEL) {
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;
    s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', window.BRAVVO_PIXEL); fbq('track', 'PageView');
    // Evento Lead com eventID: deduplica com o envio server-side (Conversions API)
    var eid = new URLSearchParams(location.search).get('eid');
    fbq('track', 'Lead', {}, eid ? { eventID: eid } : undefined);
  }
</script>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <img src="img/logo-bravvo.png" alt="Bravvo Barbearia" width="900" height="125">
  </div>

  <div class="check" aria-hidden="true">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M4 12.5l5 5L20 6.5" stroke="#c8a24a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <h1>Recebemos, <em id="nome">parceiro</em>.</h1>
  <p id="sub">Abrindo seu WhatsApp com a mensagem pronta… <b id="count">3</b></p>

  <ol class="steps">
    <li><b>1</b><span>Confirmamos o horário que melhor encaixa pra você.</span></li>
    <li><b>2</b><span>Você chega, senta e relaxa. Sem fila.</span></li>
    <li><b>3</b><span>Sai da Bravvo na régua.</span></li>
  </ol>

  <a class="cta" id="wa" href="#" rel="noopener">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2c0 1.3.9 2.5 1.1 2.7.1.2 1.9 2.9 4.6 4 1.7.7 2.3.8 3.1.7.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2l-.5-.3z"/></svg>
    Chamar no WhatsApp agora
  </a>
  <p class="fine">Se o WhatsApp não abrir sozinho, toque no botão acima.</p>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const nome = (q.get('nome') || '').trim();
  if (nome) document.getElementById('nome').textContent = nome;
  const num = "{{WHATSAPP_NUMBER}}";
  const servico = (q.get('servico') || '').trim(), desloc = (q.get('deslocamento') || '').trim();
  let m = `Olá! Sou ${nome || 'cliente'} e acabei de pedir um horário pelo site da Bravvo.`;
  if (servico) m += `\nServiço: ${servico}`;
  if (desloc) m += `\nDeslocamento: ${desloc}`;
  m += '\nQual horário vocês têm?';
  const link = num ? `https://wa.me/${num}?text=${encodeURIComponent(m)}` : './';
  document.getElementById('wa').href = link;
  // redireciona sozinho depois do evento Lead do Pixel ter tempo de disparar
  if (num) {
    let n = 3; const c = document.getElementById('count');
    const t = setInterval(() => { n--; c.textContent = n; if (n <= 0) { clearInterval(t); location.href = link; } }, 1000);
  } else { document.getElementById('sub').textContent = 'Em instantes a equipe da Bravvo chama você no WhatsApp.'; }
</script>
</body>
</html>
